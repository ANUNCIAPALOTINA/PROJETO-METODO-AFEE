name: Concorrentes do Instagram

# Toda segunda lê as contas de marketing/instagram/concorrentes.json pela API oficial
# e grava o relatório do que mais engaja em marketing/instagram/concorrentes/.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Ler concorrentes
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_RESERVA_SESSIONID: ${{ secrets.IG_RESERVA_SESSIONID }}
        run: node marketing/instagram/raspar-concorrentes.mjs && node marketing/instagram/relatorio-concorrentes.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "robo-afee"
          git config user.email "robo-afee@users.noreply.github.com"
          git add data RELATORIO-CONCORRENTES.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(marketing): relatório de concorrentes [skip ci]"
          git pull --rebase && git push
